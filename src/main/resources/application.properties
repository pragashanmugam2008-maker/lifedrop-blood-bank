# ===================================================================
# LifeDrop Blood Bank Management System Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration
# Uses environment variables DB_URL, DB_USERNAME, DB_PASSWORD with H2 zero-setup fallback
spring.datasource.url=${DB_URL:jdbc:h2:mem:lifedrop_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:BloodBankSuperSecretMasterKeyMustBeLongEnoughForHS256AlgorithmSecurityStandard2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
lifedrop.jwt.secret=${JWT_SECRET:${app.jwt.secret}}
lifedrop.jwt.expiration-ms=${JWT_EXPIRATION_MS:${app.jwt.expiration-ms}}

# LifeDrop Project Rules & Configuration Properties
lifedrop.donation.minimum-days-between-donations=90
lifedrop.donor.minimum-age=18
lifedrop.donor.maximum-age=65
lifedrop.referral.stars-reward=10
lifedrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080,https://*.vercel.app}

# Swagger / OpenAPI UI Configuration
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.lifedrop=INFO
logging.level.org.springframework.security=WARN
