# ===================================================================
# LifeDrop - Production Profile Configuration (Cloud MySQL / Render)
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (Production Cloud MySQL / TiDB)
# Credentials and host are injected via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Disable H2 Console completely in production
spring.h2.console.enabled=false

# HikariCP Cloud Connection Pool (Optimized for TiDB Serverless & Cloud MySQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# JWT Configuration (Mandatory environment variable JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
lifedrop.jwt.secret=${JWT_SECRET}
lifedrop.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# LifeDrop Rules Configuration Properties
lifedrop.donation.minimum-days-between-donations=90
lifedrop.donor.minimum-age=18
lifedrop.donor.maximum-age=65
lifedrop.referral.stars-reward=10

# CORS Configuration
lifedrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://*.onrender.com,https://*}

# Swagger UI Documentation (available for testing endpoints in production)
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.lifedrop=INFO
logging.level.org.springframework.security=WARN
